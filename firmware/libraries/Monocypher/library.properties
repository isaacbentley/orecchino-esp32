paragraph=Vendored with one change, marked "orecchino:" at the top of src/monocypher.cpp: a #pragma GCC optimize ("Os") so the file builds for size even where a sketch asks for -O2. Licence text in LICENSE. Kept as a library rather than copied into each sketch because a 110 kB source inside a sketch folder breaks arduino-cli library dependency detection. SPDX-License-Identifier: BSD-2-Clause OR CC0-1.0
