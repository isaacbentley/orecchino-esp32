# Host tests, the Mac app, the phone app, and a compile of every board
# sketch. Nothing here touches hardware; flashing stays in tools/flash_*.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to what the flash scripts are developed against.
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE: "esp32:esp32@3.3.11"
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FLUTTER_VERSION: "3.47.5"

jobs:
  # Scripts and this workflow. On Ubuntu rather than in the macOS host-tests
  # job because shellcheck is an apt package there; actionlint is fetched
  # with its own download script (pinned).
  lint:
    name: Scripts (shellcheck, actionlint, execute bits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "$ACTIONLINT_VERSION" "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: shellcheck tools/*.sh tests/*.sh
        run: shellcheck tools/*.sh tests/*.sh

      - name: actionlint
        run: actionlint .github/workflows/ci.yml

      # A script rewritten through a temp file loses its execute bit, and the
      # host tests then stop at "Permission denied". tools/flash_common.sh is
      # sourced, not run, so it is the one *.sh that stays 644.
      - name: Every tracked script under tools/ and tests/ is executable
        run: |
          bad="$(git ls-files -s tools tests \
                 | awk '$1 == "100644" && $4 ~ /\.(sh|py)$/ && $4 !~ /flash_common\.sh$/ {
                          print "::error::not executable (mode 100644): " $4 }')"
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

  host-tests:
    name: Host tests (tests/run_tests.sh)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # arduino/setup-arduino-cli has no node24 release (v2 is node20), so the
      # CLI comes from Arduino's install script instead, pinned to the same
      # version and kept between runs.
      - name: Cache arduino-cli
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/arduino-cli
          key: arduino-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.ARDUINO_CLI_VERSION }}
      - name: Install arduino-cli ${{ env.ARDUINO_CLI_VERSION }}
        run: |
          if [ ! -x "$HOME/.local/bin/arduino-cli" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
              | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      # The T5 and T-Embed render tests draw with the real Adafruit GFX font
      # bitmaps, read from the sketchbook (~/Documents/Arduino on macOS).
      - name: Install the Adafruit GFX library for the render tests
        run: |
          arduino-cli lib update-index
          arduino-cli lib install --no-deps "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4"

      # The app and mobile suites run in their own jobs below. Any other
      # SKIP (say, the render tests not finding their fonts) fails the job,
      # so a suite cannot silently drop out of CI.
      - name: Run tests/run_tests.sh
        env:
          ORECCHINO_SKIP: app mobile
        run: |
          set -o pipefail   # the default shell here has no pipefail; tee must not hide a failure
          tests/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/run_tests.log"
          if grep '^SKIP' "$RUNNER_TEMP/run_tests.log" | grep -v 'ORECCHINO_SKIP$'; then
            echo "::error::a test suite was skipped"
            exit 1
          fi

  mac-app:
    name: Mac app (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: swift test
        working-directory: app
        run: swift test

  mobile:
    name: Phone app (flutter analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  firmware:
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # FQBNs as in tools/flash_*.sh and README.md. The custom partition
        # tables sit next to each sketch; firmware/libraries holds the
        # vendored Monocypher and epdiy.
        include:
          - sketch: orecchino_fw
            fqbn: esp32:esp32:XIAO_ESP32C3:PartitionScheme=huge_app
          - sketch: orecchino_tx
            fqbn: esp32:esp32:XIAO_ESP32C3:PartitionScheme=huge_app
          - sketch: orecchino_sensecap
            fqbn: esp32:esp32:esp32s3:FlashMode=qio,FlashSize=8M,PartitionScheme=custom,PSRAM=opi,CPUFreq=240,UploadSpeed=460800,CDCOnBoot=default,LoopCore=1,EventsCore=1
          - sketch: orecchino_t5epd
            fqbn: esp32:esp32:esp32s3:FlashMode=dio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,CPUFreq=240,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          - sketch: orecchino_tembed
            fqbn: esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,CPUFreq=240,CDCOnBoot=cdc,LoopCore=1,EventsCore=1
          - sketch: orecchino_amoled
            fqbn: esp32:esp32:esp32c6:FlashSize=16M,PartitionScheme=custom,CDCOnBoot=cdc
    steps:
      - uses: actions/checkout@v5

      # Same install as the host-tests job (see the note there).
      - name: Cache arduino-cli
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/arduino-cli
          key: arduino-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.ARDUINO_CLI_VERSION }}
      - name: Install arduino-cli ${{ env.ARDUINO_CLI_VERSION }}
        run: |
          if [ ! -x "$HOME/.local/bin/arduino-cli" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
              | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      # The esp32 core and its toolchains are ~2 GB; keep them between runs.
      # (~/.arduino15 is arduino-cli's data directory on Linux.)
      - name: Cache the esp32 core
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/staging
          key: arduino15-${{ runner.os }}-${{ runner.arch }}-${{ env.ESP32_CORE }}-cli${{ env.ARDUINO_CLI_VERSION }}

      - name: Install the esp32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"

      # The versions these sketches are built with locally; --no-deps keeps
      # a dependency from floating to a newer release.
      - name: Install the libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install --no-deps \
            "NimBLE-Arduino@2.5.1" \
            "GFX Library for Arduino@1.6.7" \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit BusIO@1.17.4" \
            "PNGdec@1.1.6" \
            "PCA95x5@0.1.3"

      - name: Compile
        env:
          FQBN: ${{ matrix.fqbn }}
          SKETCH: firmware/${{ matrix.sketch }}
        run: >-
          arduino-cli compile
          --libraries firmware/libraries
          --build-path "$RUNNER_TEMP/build"
          -b "$FQBN" "$SKETCH"
