# Lints for orecchino_mobile: flutter_lints' recommended set, strict type
# checks, and a few rules that catch real bugs (dropped futures, leaked
# subscriptions) or keep the code uniform. `flutter analyze` must report
# no issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Generated by drift_dev (flutter pub run build_runner build).
    - lib/**/*.g.dart
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
