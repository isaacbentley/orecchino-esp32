name: orecchino_mobile
description: "Orecchino mobile application for Remote ID and ADS-B traffic monitoring."
publish_to: "none"
version: 0.7.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  http: ^1.2.1
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^22.3.1
  flutter_tts: ^4.2.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # The living background (lib/ui/living_background.dart).
  shaders:
    - shaders/aurora.frag

  # Bundled OFL fonts (licences beside them in assets/fonts/*/OFL.txt).
  # Variable fonts: FontWeight drives the wght axis.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
    # The Flat look (the design mockups): IBM Plex, SIL OFL 1.1, from
    # github.com/IBM/plex releases (plex-sans-condensed 2.0.0, plex-sans
    # 1.1.0, plex-mono 2.5.0); only the weights the look uses.
    - family: IBMPlexSansCondensed
      fonts:
        - asset: assets/fonts/ibm_plex_sans_condensed/IBMPlexSansCondensed-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans_condensed/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_condensed/IBMPlexSansCondensed-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700
