name: orecchino_mobile
description: "Orecchino mobile application for Remote ID and ADS-B traffic monitoring."
publish_to: "none"
version: 0.7.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  http: ^1.2.1
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^22.3.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
